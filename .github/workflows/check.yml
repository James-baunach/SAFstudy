name: Check and build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the question bank
        run: npm run check
      - name: Build the page
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: certified-forester-exams
          path: |
            certified-forester-exams.html
            offline.html
